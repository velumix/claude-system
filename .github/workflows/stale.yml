name: Stale good first issues

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          only-labels: "good first issue"
          days-before-pr-stale: -1
          days-before-pr-close: -1
          days-before-stale: 30
          days-before-close: 7
          exempt-issue-labels: "pinned,help wanted"
          stale-issue-message: "Still interested? Comment to keep this open — otherwise it'll auto-close in 7 days."
          stale-issue-label: "stale"
